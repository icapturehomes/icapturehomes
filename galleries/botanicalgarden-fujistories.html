<head>

  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--ink:#1c1c1a;--ink-dim:rgba(28,28,26,0.4);--gold:#b8924a;--border:rgba(28,28,26,0.1)}
    body{font-family:'DM Sans',sans-serif;font-weight:300;background:#fff;color:var(--ink)}
    header{display:flex;justify-content:center;padding:22px 20px;border-bottom:0.5px solid var(--border);position:sticky;top:0;background:rgba(255,255,255,0.94);backdrop-filter:blur(8px);z-index:20}
    .logo{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:300;letter-spacing:0.04em;color:var(--ink);text-decoration:none}
    .intro{text-align:center;padding:64px 20px 44px}
    .eyebrow{font-size:10px;letter-spacing:0.26em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
    h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(40px,7vw,64px);line-height:0.95}
    h1 em{font-style:italic;color:rgba(28,28,26,0.55)}
    .count{margin-top:16px;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-dim)}
    /* one story per row, centered, sized like a phone screen */
    .column{width:min(100%,520px);margin:0 auto;padding:0 0 40px;display:flex;flex-direction:column;gap:28px}
    .st{background:#f1f0ed;aspect-ratio:9/16;cursor:zoom-in;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.06)}
    .st img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 0.7s ease}
    .st.loaded{aspect-ratio:auto;background:none}
    .st.loaded img{height:auto}
    .st img.in{opacity:1}
    @media(max-width:600px){.column{gap:10px;padding-bottom:24px}.st{box-shadow:none}.intro{padding:44px 20px 32px}}
    /* lightbox */
    .lb{display:none;position:fixed;inset:0;z-index:9000;background:rgba(10,10,8,0.97);align-items:center;justify-content:center;flex-direction:column}
    .lb.open{display:flex}
    .lb img{max-width:94vw;max-height:88vh;object-fit:contain;display:block}
    .lb-close{position:fixed;top:18px;right:22px;background:none;border:none;color:rgba(255,255,255,0.45);font-size:28px;cursor:pointer}
    .lb-prev,.lb-next{position:fixed;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,0.35);font-size:48px;cursor:pointer;padding:20px}
    .lb-prev{left:0}.lb-next{right:0}
    .lb-close:hover,.lb-prev:hover,.lb-next:hover{color:#fff}
    .lb-meta{margin-top:14px;font-size:11px;letter-spacing:0.1em;color:rgba(255,255,255,0.35)}
    @media(max-width:600px){.lb-prev,.lb-next{display:none}}
    .btt{position:fixed;right:20px;bottom:20px;width:42px;height:42px;border-radius:50%;border:0.5px solid var(--border);background:rgba(255,255,255,0.94);color:var(--ink);font-size:16px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.08);opacity:0;pointer-events:none;transition:opacity 0.25s;z-index:60}
    .btt.visible{opacity:1;pointer-events:auto}
    footer{padding:28px 20px;border-top:0.5px solid var(--border);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-dim)}
    footer span:first-child{font-family:'Cormorant Garamond',serif;font-size:14px}
    img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  </style>
</head>

  <script>
    const imgs = [
    "https://lh3.googleusercontent.com/d/1qzaATvU8m_3ShMQTy3OjbRtMFFDDmx34",
    "https://lh3.googleusercontent.com/d/1VF3_yGe7evCaBuoTQgLtFLTmOFBRw8Ft",
    "https://lh3.googleusercontent.com/d/1CyRBQIRlfJRDAj8X63QHxRIwC2gsSdts",
    "https://lh3.googleusercontent.com/d/19My7bIPQkp6d8DAtfKn79SYFf-H9NJMN",
    "https://lh3.googleusercontent.com/d/1e-oWd0a3kkA7qgPV0dW9wdyGDaIo8-SK",
    "https://lh3.googleusercontent.com/d/1YGyoaZ8c5K4qPtMcO4MzLnNVf1BSmz4l",
    "https://lh3.googleusercontent.com/d/1fyd7mTUzfM8e87UFPGBcjQc1sl5chik0",
    "https://lh3.googleusercontent.com/d/1henSLwE77vW_tkJZqMJ4gsRm2giEHIhw",
    "https://lh3.googleusercontent.com/d/1s8kJxgelR_EKm_oesN-T4Wf0kd7G8wwg",
    "https://lh3.googleusercontent.com/d/1ySgCMsaWtRRwMunI5s51GMRsHmge92kv",
    "https://lh3.googleusercontent.com/d/1B7KavBSj1rQP-VAA65seCiCIny1QhtN1",
    "https://lh3.googleusercontent.com/d/11MpnHiV2xkJwSwuxcGKL5rCULOUjAq7w",
    "https://lh3.googleusercontent.com/d/1rSlg1LwhF2bGsQLTLvoaARWJk4KmMrva",
    "https://lh3.googleusercontent.com/d/15ie_LomwfrtlAS3CN7an1iSXihxy1JrA",
    "https://lh3.googleusercontent.com/d/1YFZNg9FiYBwSYS0eR_PJmEENmwwjYPKk",
    "https://lh3.googleusercontent.com/d/108Uujjjy5IqERQunsvw1cnEqgxIWaIlf",
    "https://lh3.googleusercontent.com/d/1DMJhTuYsaqA7FkDztT7nnfPesJH8LGj7",
    "https://lh3.googleusercontent.com/d/1AkClyjuiilS4_3R_9TqKiAv3Jjtja5AT",
    "https://lh3.googleusercontent.com/d/15yxhvEn2AzPQP4phaizUXxgCEO6PA0XI",
    "https://lh3.googleusercontent.com/d/1y1_8kUAXImovqpaQO2teuuWVQnl1W21D",
    "https://lh3.googleusercontent.com/d/19myNrkINhhb0K56orcMe8m7ejooeaALi",
    "https://lh3.googleusercontent.com/d/1CES0NCK6Ek3CzJm8FPg2hHr71aebW-JB",
    "https://lh3.googleusercontent.com/d/1N6hSok5OrqbnjdKUYkwQW3riml5RpG8Y",
    "https://lh3.googleusercontent.com/d/1dhcWMRbmV5pm3YLydygDkm51Sh858dbN",
    "https://lh3.googleusercontent.com/d/1EYDJveqdcZ__hVf4377WeWU7TwQp1o7L",
    "https://lh3.googleusercontent.com/d/17SS-SdfklaS76fMUDvO2eL4qpJabamkX",
    "https://lh3.googleusercontent.com/d/1kD8sMevE1k5HgfVffIZd4Ct51udYZzPS",
    "https://lh3.googleusercontent.com/d/1HpQNbc9fWbc8195MQ9_YUjGN4fQ0rzRl",
    "https://lh3.googleusercontent.com/d/1XHVT5o1qMLbGJtvLvymtBlfJu5A53tyi",
    "https://lh3.googleusercontent.com/d/1wcJu71TifECS8zrn5NJTiaX7nDK0mhuF",
    "https://lh3.googleusercontent.com/d/1XGj1n3ouYcDWicup-SPlVu-ZLkkBq1j0",
    "https://lh3.googleusercontent.com/d/1F9TEHyogz4u1vd4qLUU4rwv8UYvSXFu1"
  ];
    let ci = 0;
    const lb=document.getElementById('lb'),lbImg=document.getElementById('lb-img'),lbMeta=document.getElementById('lb-meta');
    // placeholders hold a story-shaped space; once a photo loads it shows at its true shape, uncropped
    const done=im=>{im.classList.add('in');im.parentElement.classList.add('loaded');};
    document.querySelectorAll('.st img').forEach(im=>{if(im.complete&&im.naturalWidth)done(im);else im.onload=()=>done(im);});
    function show(){lbImg.src=imgs[ci];lbMeta.textContent=(ci+1)+' / '+imgs.length;}
    function openLb(i){ci=i;show();lb.classList.add('open');document.body.style.overflow='hidden';}
    function closeLb(){lb.classList.remove('open');document.body.style.overflow='';}
    function navLb(d){ci=(ci+d+imgs.length)%imgs.length;show();}
    document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;
      if(e.key==='ArrowRight')navLb(1);if(e.key==='ArrowLeft')navLb(-1);if(e.key==='Escape')closeLb();});
    lb.addEventListener('click',e=>{if(e.target===lb)closeLb();});
    let sx=0,sy=0;
    lb.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
    lb.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
      if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)navLb(dx<0?1:-1);
      else if(dy>90&&Math.abs(dy)>Math.abs(dx)*1.3)closeLb();},{passive:true});
    const btt=document.getElementById('btt');
    window.addEventListener('scroll',()=>btt.classList.toggle('visible',scrollY>innerHeight*0.8),{passive:true});
    document.addEventListener('contextmenu',e=>{if(e.target.tagName==='IMG')e.preventDefault();});
    document.addEventListener('dragstart',e=>{if(e.target.tagName==='IMG')e.preventDefault();});
  </script>
